spring.application.name=backend

# PostgreSQL Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/research_pms}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema. See docs/shared-auth/migrations.md for the naming convention.
# out-of-order lets migrations from different component branches merge in any order.
# baseline-on-migrate lets Flyway start on a database that already contains tables.
spring.flyway.out-of-order=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JPA / Hibernate (validate only: Hibernate checks entities against the migrated schema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Authentication. See docs/shared-auth/authentication.md.
# JWT_SECRET has no default on purpose: the application refuses to start without
# a secret of at least 32 bytes. Never write a real secret in this file.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
# Comma-separated browser origins allowed to call the API (the Vite dev server by default).
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}