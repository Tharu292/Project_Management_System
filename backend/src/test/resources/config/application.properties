# Loaded in addition to src/main/resources/application.properties for every
# test run (classpath:/config/ takes precedence over classpath:/), so tests
# always use the separate test database and never touch research_pms.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/research_pms_test}
spring.jpa.show-sql=false

# Test-only signing key. It protects nothing and must never be used outside tests.
app.security.jwt.secret=test-only-jwt-signing-key-not-a-real-secret-0123456789
app.security.jwt.expiration-ms=3600000

# Tests never provision an administrator at startup, whatever the developer's
# environment contains. AdminBootstrapTest exercises the bootstrap directly.
app.bootstrap.admin.email=
app.bootstrap.admin.password=
app.bootstrap.admin.staff-id=
